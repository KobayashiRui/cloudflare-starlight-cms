name: Publish CLI

on:
  push:
    branches:
      - main
    paths:
      - packages/create-starlight-cms/package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - run: npm ci
      - name: Check npm registry
        id: version
        run: |
          current=$(node -p "require('./packages/create-starlight-cms/package.json').version")
          if npm view "create-starlight-cms@$current" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "create-starlight-cms@$current is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create-starlight-cms@$current is not published; publishing."
          fi
      - run: npm run publish:cli
        if: steps.version.outputs.publish == 'true'
