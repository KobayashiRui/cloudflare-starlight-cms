name: Publish CLI

on:
  push:
    branches:
      - main
    paths:
      - packages/create-starlight-cms/package.json

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - run: npm ci
      - name: Check CLI version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./packages/create-starlight-cms/package.json').version")
          previous=$(git show "$BEFORE:packages/create-starlight-cms/package.json" 2>/dev/null | node -e "let input = ''; process.stdin.setEncoding('utf8'); process.stdin.on('data', (chunk) => { input += chunk; }); process.stdin.on('end', () => process.stdout.write(input ? JSON.parse(input).version : ''));")
          if [ "$current" = "$previous" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "CLI version $current is unchanged; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing CLI version $current."
          fi
      - run: npm run publish:cli
        if: steps.version.outputs.publish == 'true'
