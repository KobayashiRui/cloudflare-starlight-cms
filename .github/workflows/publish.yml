name: Publish CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release tag
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('packages/create-starlight-cms/package.json', 'utf8')); const expected = \`v\${version}\`; if (process.env.GITHUB_REF_NAME !== expected) { throw new Error(\`Tag \${process.env.GITHUB_REF_NAME} must match \${expected}\`); }"
      - run: npm run publish:cli
